name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci fails on Linux because the lock file (made on Windows) misses
      # the bundler's optional wasm packages; npm install resolves them.
      - run: npm install --no-audit --no-fund
      - run: npx eslint src
      - run: npm run build
        env:
          VITE_BASE_URL: https://example.invalid
